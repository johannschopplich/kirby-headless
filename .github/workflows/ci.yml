name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: php (Kirby ${{ matrix.kirby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kirby: ["5", "6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none

      - if: matrix.kirby == '5'
        run: composer install --no-interaction --no-progress
      # KQL for Kirby 6 is only a branch so far.
      - if: matrix.kirby == '6'
        run: |
          composer require --dev --no-update "getkirby/kql:v6.x-dev"
          composer update getkirby/cms getkirby/kql --with "getkirby/cms:^6.0" --with-all-dependencies --no-interaction --no-progress
      - run: vendor/bin/phpunit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
      - run: pnpm run lint
      - run: pnpm exec prettier --check "scripts/**"
